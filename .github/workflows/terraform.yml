# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stage
          - prod
        inputs:
      apply:
        description: 'Execute terraform apply'
        type: boolean
        default: false
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TF_VAR_ssh_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: hashicorp/setup-terraform@v4.0.0

      - name: YC Auth
        run: |
          mkdir -p $HOME/.yc
          echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY }}' > $HOME/.yc/key.json
          echo "YC_SERVICE_ACCOUNT_KEY_FILE=$HOME/.yc/key.json" >> $GITHUB_ENV

      - name: Run terraform init
        run: terraform -chdir=./Task2Advanced/ init -backend-config="access_key=${{ secrets.ACCESS_KEY }}" -backend-config="secret_key=${{ secrets.SECRET_KEY }}"

      - name: Run terraform plan
        run: terraform -chdir=./Task2Advanced/ plan -no-color -var-file=../Task1Advanced/envs/${{ inputs.env }}/terraform.tfvars

      - name: Run terraform apply
        if: ${{ inputs.apply }}
        run: terraform -chdir=./Task2Advanced/ apply -no-color -auto-approve -var-file=../Task1Advanced/envs/${{ inputs.env }}/terraform.tfvars
